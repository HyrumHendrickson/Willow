[package]
name = "willow"
version = "0.2.0"
edition = "2021"
rust-version = "1.82"
description = "Willow: a visual editor for static websites hosted on GitHub Pages"
license = "MIT"
repository = "https://github.com/HyrumHendrickson/Willow"
readme = "README.md"
keywords = ["website-builder", "editor", "github-pages", "egui"]
categories = ["gui", "web-programming"]

[dependencies]
eframe = "0.31"
egui_extras = { version = "0.37", features = ["file", "image"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
rfd = "0.15"
open = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
