[package]
name = "site_builder"
version = "0.1.0"
edition = "2021"
description = "Visual editor for static microschool websites hosted on GitHub Pages"

[dependencies]
eframe = "0.31"
egui_extras = { version = "0.31", features = ["file", "image"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
rfd = "0.15"
open = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
